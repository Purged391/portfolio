
  <div class="contact-container">
  <canvas #canvas></canvas>
  <div class="container">
    @if (this.display() === 'earth') {
      <div class="text-container">
        <h1>Linkedin</h1>
        <h1>Curriculum</h1>
        <h1>Correo</h1>
      </div>

    } @else{
      <div class="text-container">
        <h1>github</h1>
      </div>
    }

    <div class="button-container">
      <button [class.active] = "this.display() === 'moon'" (click)="this.goToMoon()">Moon</button>
      <button [class.active] = "this.display() === 'earth'" (click)="this.goToEarth()">Earth</button>
    </div>
  </div>
  </div>
